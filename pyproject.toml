[project]
name = "shipsafe-agentops"
version = "0.1.0"
description = "AgentOps — fleet health observability for ShipSafe AI agents via Dynatrace + OTel"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Prateek Srivastava", email = "prateek.srivastava2311@gmail.com" }
]

dependencies = [
    # Shared instrumentation, OTel fan-out to Phoenix + Dynatrace
    "shipsafe-shared @ file:///Users/prateeksrivastava/Documents/shipsafe/shipsafe-shared",

    # Google ADK — orchestrator + specialist agents
    "google-adk>=1.0.0",

    # Pydantic for structured outputs (Rule 9: no raw LLM strings)
    "pydantic>=2.0",

    # OTLP HTTP exporter (also pulled in via shipsafe-shared, pinned for clarity)
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-api>=1.24.0",

    # HTTP client for Dynatrace MCP / health checks
    "httpx>=0.27.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=agent --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agent"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
